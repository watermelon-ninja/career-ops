# Selena exhaustive target-company lane.
# discover-ats.mjs appends resolved ATS mappings to tracked_companies.
# This lane intentionally has NO positive title requirement.
title_filter:
  mode: negative_only
  positive: []
  negative:
    - "software engineer"
    - "software developer"
    - "nurse"
    - "physician"
    - "driver"
    - "warehouse associate"
    - "sales representative"
    - "account executive"
    - "intern"
    - "internship"

# Recall-first location net. Precise Texas-eligible remote validation happens
# after the full JD is fetched; do not reject ambiguous provider metadata here.
location_filter:
  allow:
    - "Austin"
    - "Cedar Park"
    - "Round Rock"
    - "Georgetown"
    - "Pflugerville"
    - "Leander"
    - "Remote"


tracked_companies:
  # Native upstream providers that discover-ats.mjs cannot infer from a generic
  # company name. Keep these explicit so Selena's target lane actually reaches
  # the provider modules already shipped by Career-Ops.
  - name: "Google"
    enabled: true
    provider: google
    google:
      location: "Austin, Texas, United States"
      queries:
        - "supply chain"
        - "business systems"
        - "business analyst"
        - "product manager"
        - "product owner"
        - "program manager"
        - "technical program manager"
        - "implementation"
        - "integration"
        - "operations"

  - name: "Amazon"
    enabled: true
    provider: amazon
    careers_url: "https://www.amazon.jobs/en/"
    amazon:
      loc_query: "Austin, Texas"
      normalized_country_code:
        - "USA"