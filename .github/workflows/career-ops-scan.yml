name: Career-Ops Scan

on:
  workflow_dispatch:
    inputs:
      company:
        description: "Optional company name; leave blank to scan all configured portals"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: career-ops-scan-selena
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Selena Career-Ops branch
        uses: actions/checkout@v4
        with:
          ref: codex/recreate-phase-1-and-phase-2-files
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax-check JD and Fit runners
        run: |
          node --check fetch-jd-batch.mjs
          node --check score-selena-fit.mjs
      - name: Run Career-Ops scanner
        shell: bash
        run: |
          if [ -n "${{ inputs.company }}" ]; then
            node scan.mjs --company "${{ inputs.company }}"
          else
            node scan.mjs --universe --universe-batch 250
          fi
      - name: Read full JD — Batch 1
        run: node fetch-jd-batch.mjs
      - name: Score Selena Fit
        run: node score-selena-fit.mjs
      - name: Show scan, JD and Fit summary
        shell: bash
        run: |
          git status --short
          cat data/latest-jd-read-summary.json 2>/dev/null || true
          cat data/latest-selena-fit-summary.json 2>/dev/null || true
      - name: Commit scan results to Selena branch
        shell: bash
        run: |
          git add data/scan-history.tsv data/pipeline.md data/universe-cursor.json data/latest-jd-candidates.jsonl data/multi-source-discovery-results.json data/latest-jd-read-results.jsonl data/latest-jd-read-summary.json data/latest-selena-fit-results.jsonl data/latest-selena-fit-summary.json data/processed-jobs.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "career-ops-bot"
          git config user.email "career-ops-bot@users.noreply.github.com"
          git commit -m "chore: update Career-Ops scan and JD results"
          git push origin HEAD:codex/recreate-phase-1-and-phase-2-files
