name: Prepare Selena Scoring Input

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/recreate-phase-1-and-phase-2-files
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare current batch scoring input
        run: node prepare-scoring-input.mjs
      - name: Commit scoring input
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scoring-input
          git diff --cached --quiet || git commit -m "chore: prepare Selena scoring input"
          git push origin HEAD:codex/recreate-phase-1-and-phase-2-files
