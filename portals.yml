# Portal Scanner Configuration
# Personalized for Selena Liu: Enterprise Supply Chain Systems & Integration.

location_filter:
  allow:
    - "Remote"
    - "Austin"
    - "Texas"
    - "TX"
  block: []

title_filter:
  # Stage 1 is intentionally high-recall. Full-JD scoring provides precision later.
  positive:
    # Systems / Business Analysis
    - "Business Systems Analyst"
    - "Business Analyst"
    - "Technical Business Analyst"
    - "IT Business Analyst"
    - "Systems Analyst"
    - "IT Systems Analyst"
    - "Business Technology Analyst"
    - "Business Process Analyst"
    - "Functional Analyst"
    - "Systems Integration Analyst"
    - "Operations Systems Analyst"
    - "Application Analyst"
    - "Applications Analyst"

    # Product / Product Operations
    - "Product Owner"
    - "Technical Product Owner"
    - "Product Manager"
    - "Technical Product Manager"
    - "Product Operations"
    - "Product Analyst"
    - "Product Delivery"

    # Program / Project / Delivery
    - "Program Manager"
    - "Technical Program Manager"
    - "Project Manager"
    - "Technical Project Manager"
    - "IT Project Manager"
    - "Delivery Lead"
    - "Program Lead"

    # Supply Chain / Operations / Logistics Systems
    - "Supply Chain Analyst"
    - "Supply Chain Systems"
    - "Supply Chain Technology"
    - "Supply Chain Program Manager"
    - "Supply Chain Product"
    - "Logistics Analyst"
    - "Logistics Manager"
    - "Logistics Systems"
    - "Warehouse Systems"
    - "Warehouse Technology"
    - "WMS"
    - "Inventory Systems"
    - "Inventory Analyst"
    - "Planning Systems"
    - "Order Management"
    - "Fulfillment Systems"
    - "Warehouse Automation"

    # Implementation / Transformation / Consulting
    - "Implementation Consultant"
    - "Implementation Manager"
    - "Implementation Lead"
    - "Business Transformation Consultant"
    - "Technology Consultant"
    - "Solutions Consultant"
    - "Solution Consultant"
    - "Transformation Manager"

    # Enterprise applications / platforms
    - "Enterprise Systems"
    - "ERP Analyst"
    - "ERP Manager"
    - "SAP Analyst"
    - "SAP Business Analyst"
    - "Kinaxis"
    - "Infor"
    - "RapidResponse"
    - "Application Product Owner"
    - "Systems Integration"

    # BI / analytics: intentionally broad; JD scoring must validate domain fit.
    - "Business Intelligence Analyst"
    - "BI Analyst"
    - "Data Analyst"
    - "Analytics Analyst"
    - "Operations Analyst"

  negative:
    # Frontline / clearly unrelated
    - "Warehouse Associate"
    - "Warehouse Worker"
    - "Forklift"
    - "Picker"
    - "Packer"
    - "Delivery Driver"
    - "Truck Driver"
    - "Retail Associate"
    - "Account Executive"
    - "Sales Development"
    - "Business Development Representative"

    # Early-career programs
    - "Intern"
    - "Internship"
    - "New Grad"
    - "University Grad"
    - "Graduate Program"

    # Executive seniority
    - "Senior Director"
    - "Executive Director"
    - "Vice President"
    - "VP,"

  seniority_boost:
    - "Senior"
    - "Lead"
    - "Principal"
    - "Analyst"
    - "Product Owner"
    - "Product Manager"
    - "Implementation"
    - "Program Manager"

search_queries:
  - name: Supply Chain Systems — Greenhouse/Ashby/Lever
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io OR site:jobs.ashbyhq.com OR site:jobs.lever.co "Supply Chain Systems Analyst" OR "Business Systems Analyst" OR "Systems Integration Analyst"'
    enabled: true
  - name: WMS and Warehouse Systems — All portals
    query: '"WMS" OR "Warehouse Management System" "Analyst" OR "Product Owner" OR "Implementation Manager" "Remote" OR "United States"'
    enabled: true
  - name: Supply Chain Product Owner — All portals
    query: '"Product Owner" "Supply Chain" OR "Warehouse" OR "Fulfillment" OR "Order Management" "Remote" OR "United States"'
    enabled: true
  - name: Enterprise Supply Chain Technology — All portals
    query: '"Supply Chain Technology" OR "Operations Systems" OR "Enterprise Systems" "Analyst" OR "Program Manager" "Remote" OR "United States"'
    enabled: true
  - name: Logistics and Inventory Systems — All portals
    query: '"Logistics Systems" OR "Inventory Systems" OR "Fulfillment Systems" "Analyst" OR "Business Systems" OR "Integration"'
    enabled: true
  - name: SAP / Infor / Kinaxis roles — All portals
    query: '"SAP" OR "Infor WMS" OR "Kinaxis RapidResponse" "Supply Chain" "Analyst" OR "Product Owner" OR "Implementation"'
    enabled: true

